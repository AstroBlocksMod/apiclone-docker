# Shared by http.conf and https.conf, inside their server block.

root /usr/share/nginx/www;
client_max_body_size 16m;

# APIClone's own static files (ScratchR2 pages, the admin and so on).
location ^~ /scratchr2/static/ {
    alias /usr/share/nginx/apiclone-static/;
    expires 1h;
}

# scratch-www's pages, redirects and static files. Generated at build time by
# bin/configure-nginx.js from scratch-www's routes.
include /etc/nginx/apiclone/scratch-www-routes.conf;

# Everything else goes to APIClone: the API hosts, cloud variables (WebSocket)
# and every page scratch-www does not have.
location / {
    proxy_pass http://apiclone;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Cloud variable connections stay open while a project is running.
    proxy_read_timeout 1h;
}
