# http context, included by http.conf and https.conf.

# Docker's DNS. Resolving at runtime keeps nginx working when Compose recreates
# APIClone with a new address while the proxy keeps running.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream apiclone {
    zone apiclone 64k;
    server apiclone:8000 resolve;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" "";
}
