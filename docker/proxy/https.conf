# HTTPS, used when /etc/nginx/certs has fullchain.pem and privkey.pem.
# ${SITE_URL} is filled in when the container starts.

include /etc/nginx/apiclone/common.conf;

map $scheme $forwarded_proto {
    default $scheme;
}

server {
    listen 80 default_server;
    server_name _;

    # The container healthcheck talks plain HTTP.
    location = /health/ {
        proxy_pass http://apiclone;
        proxy_set_header Host $http_host;
    }

    location / {
        return 301 ${SITE_URL}$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/apiclone/site.conf;
}
