# Plain HTTP, used when no certificate is mounted. If another proxy in front of
# this one terminates TLS, its X-Forwarded-Proto header is passed on to APIClone.

include /etc/nginx/apiclone/common.conf;

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80 default_server;
    server_name _;
    include /etc/nginx/apiclone/site.conf;
}
