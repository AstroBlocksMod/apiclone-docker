# Production: nginx serving the built scratch-www and proxying to APIClone under
# Daphne, with Valkey and the database picked by DB_ENGINE. Settings come from
# .env (see .env.example). Run it through scripts/prod.
name: apiclone

x-apiclone-build: &apiclone-build
  context: .
  target: apiclone
  args:
    - APICLONE_REPO
    - APICLONE_COMMIT

x-apiclone-environment: &apiclone-environment
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  SITE_URL: ${SITE_URL:?Set SITE_URL in .env}
  EXTRA_ALLOWED_HOSTS: ${EXTRA_ALLOWED_HOSTS:-}
  EXTRA_ORIGINS: ${EXTRA_ORIGINS:-}
  DB_ENGINE: ${DB_ENGINE:-mysql}
  DB_HOST: ${DB_HOST:-${DB_ENGINE:-mysql}}
  DB_PORT: ${DB_PORT:-}
  DB_NAME: ${DB_NAME:-apiclone}
  DB_USER: ${DB_USER:-apiclone}
  DB_PASSWORD: ${DB_PASSWORD:-}
  REDIS_URL: ${REDIS_URL:-redis://valkey:6379/0}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-}
  EMAIL_USER: ${EMAIL_USER:-}
  EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
  REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-}
  USE_THEME_SELECTOR: ${USE_THEME_SELECTOR:-}
  THEME_SELECTION_DEFAULT: ${THEME_SELECTION_DEFAULT:-}
  LOG_LEVEL: ${LOG_LEVEL:-}

# Only the database service of the active profile exists, hence required: false.
x-database: &database
  mysql:
    condition: service_healthy
    required: false
  mariadb:
    condition: service_healthy
    required: false
  valkey:
    condition: service_healthy

services:
  # Applies migrations once, before APIClone and the jobs start.
  migrate:
    image: apiclone-docker/apiclone:local
    build: *apiclone-build
    environment: *apiclone-environment
    volumes:
      - data:/data
    command: [python, manage.py, migrate, --noinput]
    healthcheck:
      disable: true
    depends_on: *database

  apiclone:
    image: apiclone-docker/apiclone:local
    build: *apiclone-build
    environment: *apiclone-environment
    volumes:
      - data:/data
    restart: unless-stopped
    depends_on:
      <<: *database
      migrate:
        condition: service_completed_successfully

  # Runs APIClone's scheduled jobs (search index, Scratcher promotion, account
  # deletion) instead of the request-driven polyfill.
  jobs:
    image: apiclone-docker/apiclone:local
    build: *apiclone-build
    environment: *apiclone-environment
    volumes:
      - data:/data
    command: [python, /opt/apiclone-docker/jobs.py]
    restart: unless-stopped
    healthcheck:
      # jobs.py touches the file on every pass of its loop, about once a
      # minute. A long job (indexing a big site) delays that, hence the margin.
      test: [CMD-SHELL, 'test -n "$$(find /tmp/jobs-heartbeat -mmin -30)"']
      interval: 60s
      timeout: 5s
      start_period: 60s
    depends_on:
      <<: *database
      migrate:
        condition: service_completed_successfully

  proxy:
    image: apiclone-docker/proxy:local
    build:
      context: .
      target: proxy
      args:
        - APICLONE_REPO
        - APICLONE_COMMIT
        - WWW_REPO
        - WWW_COMMIT
        - NGINX_ROUTES_SCRIPT
        - SITE_URL
    environment:
      SITE_URL: ${SITE_URL:?Set SITE_URL in .env}
    volumes:
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
    restart: unless-stopped
    depends_on:
      apiclone:
        condition: service_healthy

  # Cache and cloud variable messages. Nothing in it needs to persist.
  valkey:
    image: valkey/valkey:9.1.4-alpine@sha256:56729e68bdda139cbd3f6a2538683dc3523325fc5711ea1a379938f1b37893f0
    command: [valkey-server, --save, "", --appendonly, "no"]
    restart: unless-stopped
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    profiles: [mysql]
    image: mysql:9.7.4@sha256:df90258da46f6e7ff8574ff84f17618aba0765cac749928299c69fd4e7cb8ad8
    environment:
      MYSQL_DATABASE: ${DB_NAME:-apiclone}
      MYSQL_USER: ${DB_USER:-apiclone}
      MYSQL_PASSWORD: ${DB_PASSWORD:-}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      # Over TCP on purpose: the image's first-run setup listens on a socket only.
      test: [CMD-SHELL, 'mysql -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" -e "SELECT 1" "$$MYSQL_DATABASE"']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  mariadb:
    profiles: [mariadb]
    image: mariadb:12.3.3@sha256:4ebbcf100a3ba320766dfa0e1af008df12261301db6ef72798c7650f70794aed
    environment:
      MARIADB_DATABASE: ${DB_NAME:-apiclone}
      MARIADB_USER: ${DB_USER:-apiclone}
      MARIADB_PASSWORD: ${DB_PASSWORD:-}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mariadb:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  data:
  mysql:
  mariadb:
